name: Documentation Validation

on:
  push:
    paths: ['**.md', '.github/scripts/**', '.github/workflows/mermaid-lint.yml', 'package*.json', 'blueprints/**', '.gitignore']
  pull_request:
    paths: ['**.md', '.github/scripts/**', '.github/workflows/mermaid-lint.yml', 'package*.json', 'blueprints/**', '.gitignore']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

  blueprint-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'blueprints/inference-starter-kit/requirements.txt'
      - run: python -m pip install -r blueprints/inference-starter-kit/requirements.txt
      - run: python .github/scripts/check-blueprints.py
